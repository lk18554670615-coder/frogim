name: linli_im
description: "青蛙呱呱 - a polished, reliable Flutter instant messaging client."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  cryptography: ^2.9.0
  device_info_plus: 13.2.0
  file_picker: ^10.3.7
  flutter_slidable: ^4.0.3
  # 3.1.5 guards Android 14+ foreground microphone/camera service types until
  # the matching runtime permission exists and always posts the FGS placeholder.
  flutter_callkit_incoming: 3.1.5
  # LiveKit 2.7.0 pins this exact WebRTC build to avoid native SDK conflicts.
  flutter_webrtc: 1.4.0
  flutter_secure_storage: ^10.0.0
  gal: ^2.3.3
  getuiflut:
    path: ../../packages/getuiflut
  http: ^1.6.0
  image: 4.8.0
  image_picker: ^1.2.1
  intl: any
  mobile_scanner: ^7.2.0
  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0
  zxing2: ^0.2.4
  shared_preferences: ^2.5.4
  record: ^7.1.1
  audioplayers: ^6.8.1
  cached_network_image: ^3.4.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  pinyin: ^3.3.0
  pro_image_editor: 13.3.1
  url_launcher: ^6.3.2
  video_compress: 3.1.4
  video_player: 2.13.0
  web: ^1.1.1
  # IM/RTC versions are deliberately exact; see third_party/wukongim/versions.lock.json.
  wukongimfluttersdk: 1.7.9
  wukong_easy_sdk: 1.0.3
  livekit_client: 2.7.0

# The pinned full WuKong SDK still declares connectivity_plus ^6.1.0 while
# LiveKit 2.7.0 requires ^7.0.0. The only API used by WuKong (checkConnectivity)
# is source-compatible with 7.0.0; keep this override explicit and tested.
dependency_overrides:
  connectivity_plus: 7.0.0
  # LiveKit 2.7.0 still declares device_info_plus ^12.3.0. This audited copy is
  # the official 13.2.0 source with only the unsupported Windows/Linux plugin
  # registrations removed, avoiding a win32 5/6 conflict in host-side tests.
  device_info_plus:
    path: ../../third_party/device_info_plus-13.2.0-four-platform
  # 1.7.9 leaves Socket onError/onDone disconnected from its existing 1.5s
  # reconnect callback. This audited source copy changes only that lifecycle
  # edge; protocol, database and public SDK APIs remain the official release.
  wukongimfluttersdk:
    path: ../../third_party/wukongim/flutter-sdk-1.7.9-patched
  # Keep the LiveKit-audited 1.4.0 ABI while forcing Android 14+ to request
  # full-display MediaProjection. This avoids selecting a stale CallKit task
  # from the single-app sharing picker.
  flutter_webrtc:
    path: ../../third_party/flutter_webrtc-1.4.0-full-display
  # WuKong Flutter SDK -> encrypt 5.x still declares pointycastle 3.x, while
  # LiveKit 2.7.0 -> dart_jsonwebtoken requires 4.x. Encrypt's used AES API is
  # source-compatible; compile and encrypted-handshake probes guard this pin.
  pointycastle: 4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/qingwaguagua-icon.png
  adaptive_icon_background: "#123B32"
  adaptive_icon_foreground: assets/brand/qingwaguagua-adaptive-foreground.png
  adaptive_icon_monochrome: assets/brand/qingwaguagua-adaptive-foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/qingwaguagua-icon.png
    background_color: "#123B32"
    theme_color: "#123B32"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # 个推当前仍依赖 CocoaPods；项目级关闭 SwiftPM，避免 iOS 插件重复或漏链接。
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/avatars/
    - assets/fonts/OFL.txt
    - assets/fonts/NotoColorEmoji-OFL.txt
    - assets/fonts/THIRD_PARTY.md

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add more custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
