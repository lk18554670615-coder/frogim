server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Flutter 的入口文件名不带内容哈希，必须每次校验，避免发布后继续运行旧协议和旧配置。
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /flutter_bootstrap.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /main.dart.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location = /flutter_service_worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /linli_push_worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
  }

  location ~ ^/(?:version\.json|manifest\.json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # 本地整栈通过同源网关访问业务 API 与 WuKong WSS；生产由外层 Caddy 执行同一职责。
  location ~ ^/v[12]/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 65s;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
