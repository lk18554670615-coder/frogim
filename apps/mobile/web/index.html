<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="青蛙呱呱是一款支持单聊、群聊、文件、语音与视频通话的即时通讯应用。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="青蛙呱呱">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#172533" media="(prefers-color-scheme: dark)">
  <style>
    html, body {
      background: #F2F5F8;
      height: 100%;
      margin: 0;
    }
    .app-startup {
      align-items: center;
      background: #F2F5F8;
      color: #172533;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      position: fixed;
      z-index: 2147483647;
    }
    .app-startup__content {
      box-sizing: border-box;
      max-width: 360px;
      padding: 32px 24px;
      text-align: center;
      width: 100%;
    }
    .app-startup__logo {
      border-radius: 18px;
      height: 72px;
      width: 72px;
    }
    .app-startup__title {
      font-size: 20px;
      font-weight: 700;
      margin: 18px 0 8px;
    }
    .app-startup__status {
      color: #657585;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }
    .app-startup__spinner {
      animation: app-startup-spin 0.9s linear infinite;
      border: 3px solid rgba(31, 111, 235, 0.16);
      border-radius: 50%;
      border-top-color: #1F6FEB;
      height: 26px;
      margin: 24px auto 0;
      width: 26px;
    }
    .app-startup__retry {
      background: #1F6FEB;
      border: 0;
      border-radius: 8px;
      color: #FFFFFF;
      cursor: pointer;
      display: none;
      font-size: 14px;
      font-weight: 600;
      margin: 20px auto 0;
      min-height: 42px;
      padding: 0 22px;
    }
    .app-startup--error .app-startup__spinner { display: none; }
    .app-startup--error .app-startup__retry { display: block; }
    .app-startup--slow .app-startup__retry { display: block; }
    @keyframes app-startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .app-startup__spinner { animation-duration: 1.8s; }
    }
    @media (prefers-color-scheme: dark) {
      html, body, .app-startup { background: #0F1923; color: #F2F5F8; }
      .app-startup__status { color: #AEBBC7; }
    }
  </style>
  <title>青蛙呱呱</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-startup" id="app-startup" role="status" aria-live="polite">
    <div class="app-startup__content">
      <img class="app-startup__logo" src="icons/Icon-192.png" alt="">
      <div class="app-startup__title">青蛙呱呱</div>
      <p class="app-startup__status" id="app-startup-status">正在加载应用，请稍候…</p>
      <div class="app-startup__spinner" aria-hidden="true"></div>
      <button class="app-startup__retry" id="app-startup-retry" type="button">重新加载</button>
      <noscript><p class="app-startup__status">请启用 JavaScript 后重新打开。</p></noscript>
    </div>
  </div>
  <!-- Fixed official WuKongIM Web SDK; must load before Flutter initializes. -->
  <script src="app_startup.js" defer></script>
  <script src="wukongimjssdk-1.3.5.umd.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
