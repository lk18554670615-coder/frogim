org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Fail over quickly when a third-party plugin appends an unreachable upstream
# repository after the mainland mirrors.
systemProp.org.gradle.internal.http.connectionTimeout=10000
systemProp.org.gradle.internal.http.socketTimeout=60000
android.useAndroidX=true
# The checked-out product directory uses its Chinese product name on Windows.
# Android's default path guard rejects that valid workspace even though the
# toolchain and generated artifacts are UTF-8 safe.
android.overridePathCheck=true
# Windows developers may build through the repository's ASCII junction. Kotlin
# incremental caches cannot safely mix junction and physical drive roots.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
