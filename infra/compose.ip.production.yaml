# Production-only override for the IP/certbot gateway. Always combine with compose.ip.yaml.
services:
  web:
    build:
      args:
        APP_ENV: production
        ENABLE_DEMO: "false"
        TERMS_URL: ${TERMS_URL:?set TERMS_URL}
        PRIVACY_URL: ${PRIVACY_URL:?set PRIVACY_URL}

  server:
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      IM_ENV: production
      IM_DEV_MODE: "false"
      IM_DEV_ALLOW_CONTAINER_BIND: "false"
      IM_IP_TEST_ONLY: "false"
      IM_DEV_OTP_CODE: ""
      IM_OTP_WEBHOOK_URL: ${IM_OTP_WEBHOOK_URL:?set IM_OTP_WEBHOOK_URL}
      IM_OTP_WEBHOOK_TOKEN: ${IM_OTP_WEBHOOK_TOKEN:?set IM_OTP_WEBHOOK_TOKEN}
      IM_PUSH_WEBHOOK_URL: ${IM_PUSH_WEBHOOK_URL:-}
      IM_PUSH_WEBHOOK_TOKEN: ${IM_PUSH_WEBHOOK_TOKEN:-}
      IM_S3_ACCESS_KEY: ${MINIO_APP_USER:?set MINIO_APP_USER}
      IM_S3_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}

  minio-init:
    environment:
      MINIO_APP_USER: ${MINIO_APP_USER:?set MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
    volumes:
      - ./minio-init.sh:/config/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/config/minio-init.sh"]
    command: []

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/nexachat.rules.yml:/etc/prometheus/nexachat.rules.yml:ro
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/monitoring/prometheus:/prometheus
    expose:
      - "9090"
    networks:
      - app
    depends_on:
      server:
        condition: service_healthy
      backup-metrics:
        condition: service_started
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup-metrics:
    image: docker.io/prom/node-exporter@sha256:863b62ff9f392b6f472e22b4b670ad1cabb66b3042502ebd4b2cd192733e1bce
    platform: linux/amd64
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      - --web.listen-address=:9100
    volumes:
      - ${BACKUP_METRICS_DIR:?set BACKUP_METRICS_DIR}:/var/lib/node_exporter/textfile:ro
    expose:
      - "9100"
    networks:
      - app
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio-client:
    environment:
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_ACCESS_KEY: ${BACKUP_OFFSITE_ACCESS_KEY:-}
      BACKUP_OFFSITE_SECRET_KEY: ${BACKUP_OFFSITE_SECRET_KEY:-}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-}
    networks:
      - data
      - edge
