# Development-stage public replacement overlay. It runs the real WuKongIM and
# LiveKit stack on the production IP, while retaining the fixed OTP required for
# rapid acceptance before an external SMS provider is connected.
services:
  web:
    image: ${LINLI_WEB_IMAGE:?set LINLI_WEB_IMAGE}

  admin:
    image: ${LINLI_ADMIN_IMAGE:?set LINLI_ADMIN_IMAGE}

  server:
    image: ${LINLI_SERVER_IMAGE:?set LINLI_SERVER_IMAGE}
    environment:

  wukong-policy-plugin-init:
    image: ${LINLI_WUKONG_POLICY_IMAGE:?set LINLI_WUKONG_POLICY_IMAGE}
    read_only: false
    cap_drop: []
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt: []

  wukong-probe:
    image: ${LINLI_WUKONG_PROBE_IMAGE:?set LINLI_WUKONG_PROBE_IMAGE}

  livekit:
    image: ${LINLI_LIVEKIT_IMAGE:?set LINLI_LIVEKIT_IMAGE}
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${SERVER_IP:?set SERVER_IP}"]
    volumes:
      - ./livekit/livekit.public.yaml:/etc/livekit.yaml:ro

  prometheus:
    image: ${LINLI_PROMETHEUS_IMAGE:?set LINLI_PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/nexachat.rules.yml:/etc/prometheus/nexachat.rules.yml:ro
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/monitoring/prometheus:/prometheus
    user: "0:0"
    read_only: false
    expose:
      - "9090"
    networks:
      - app
    depends_on:
      server:
        condition: service_healthy
      backup-metrics:
        condition: service_started
    restart: unless-stopped

  backup-metrics:
    image: ${LINLI_NODE_EXPORTER_IMAGE:?set LINLI_NODE_EXPORTER_IMAGE}
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      - --web.listen-address=:9100
    volumes:
      - ${BACKUP_METRICS_DIR:?set BACKUP_METRICS_DIR}:/var/lib/node_exporter/textfile:ro
    expose:
      - "9100"
    networks:
      - app
    restart: unless-stopped
