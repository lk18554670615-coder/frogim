# Only disposable signaling tests. No public WebRTC/media ports are exposed.
port: 7880
rtc:
  node_ip: 127.0.0.1
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
room:
  auto_create: false
  empty_timeout: 60
  departure_timeout: 20
  max_participants: 9
logging:
  level: error
  json: true
