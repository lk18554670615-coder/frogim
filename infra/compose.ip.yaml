# 仅用于公网验收测试：固定 DevMode + 静态验证码，严禁作为生产上线配置。
# IP 证书生产部署必须额外叠加 compose.ip.production.yaml。
# 兼容标识：IP 部署 project 名关联既有 volume/network，迁移前不得修改。
name: nexachat-ip

x-logging: &service-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-10}"
    compress: "true"

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  logging: *service-logging
  security_opt:
    - no-new-privileges:true

services:
  gateway:
    <<: *service-defaults
    image: caddy:2.10-alpine
    environment:
      SERVER_IP: ${SERVER_IP:?set SERVER_IP}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - ${CERTBOT_DIR:?set CERTBOT_DIR}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:?set CERTBOT_WEBROOT}:/var/www/certbot:ro
      - ${DOWNLOAD_DIR:-/data/linli-im/shared/downloads}:/srv/downloads:ro
      - ./legal:/srv/legal:ro
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/caddy/data:/data
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/caddy/config:/config
    networks:
      - edge
      - app
      - data
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      server:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile.web
      args:
        WEB_API_BASE_URL: https://${SERVER_IP:?set SERVER_IP}
        WEB_BASE_HREF: /web/
        APP_ENV: staging
        ENABLE_DEMO: "false"
        TERMS_URL: ${TERMS_URL:-}
        PRIVACY_URL: ${PRIVACY_URL:-}
    expose:
      - "8080"
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  admin:
    <<: *service-defaults
    build:
      context: ../apps/admin
      args:
        VITE_ADMIN_API_URL: /api/v2/admin
        VITE_ALLOW_DEMO: "false"
    expose:
      - "8080"
    networks:
      - app
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  server:
    <<: *service-defaults
    build:
      context: ../server
    environment:
      IM_ADDR: :8080
      IM_ENV: development
      IM_LOG_LEVEL: ${IM_LOG_LEVEL:-info}
      IM_DATABASE_URL: ${IM_DATABASE_URL:?set IM_DATABASE_URL}
      IM_REDIS_URL: ${IM_REDIS_URL:?set IM_REDIS_URL}
      IM_JWT_SECRET: ${IM_JWT_SECRET:?set IM_JWT_SECRET}
      IM_ADMIN_EMAIL: ${IM_ADMIN_EMAIL:?set IM_ADMIN_EMAIL}
      IM_ADMIN_PASSWORD_HASH: ${IM_ADMIN_PASSWORD_HASH:?set IM_ADMIN_PASSWORD_HASH}
      IM_ADMIN_TOTP_SECRET: ${IM_ADMIN_TOTP_SECRET:?set IM_ADMIN_TOTP_SECRET}
      IM_ADMIN_SHARED_KEY_ENABLED: "false"
      IM_ADMIN_KEY: ""
      IM_PUSH_PROVIDER: ${IM_PUSH_PROVIDER:?set IM_PUSH_PROVIDER}
      IM_GETUI_APP_ID: ${IM_GETUI_APP_ID:-}
      IM_GETUI_APP_KEY: ${IM_GETUI_APP_KEY:-}
      IM_GETUI_MASTER_SECRET: ${IM_GETUI_MASTER_SECRET:-}
      IM_DEV_MODE: "true"
      IM_SEED_DEMO: "false"
      IM_DEV_ALLOW_CONTAINER_BIND: "true"
      IM_IP_TEST_ONLY: "true"
      IM_DEV_OTP_CODE: ${IM_DEV_OTP_CODE:-}
      IM_TRUST_PROXY: "true"
      IM_ALLOWED_ORIGINS: https://${SERVER_IP:?set SERVER_IP}
      IM_ACCESS_TTL: ${IM_ACCESS_TTL:-15m}
      IM_REFRESH_TTL: ${IM_REFRESH_TTL:-720h}
      IM_MEDIA_MAX_BYTES: ${IM_MEDIA_MAX_BYTES:-104857600}
      IM_S3_ENDPOINT: minio:9000
      IM_S3_PUBLIC_ENDPOINT: ${SERVER_IP:?set SERVER_IP}
      IM_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      IM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      IM_S3_BUCKET: ${IM_S3_BUCKET:-nexachat-media}
      IM_S3_REGION: ${IM_S3_REGION:-us-east-1}
      IM_S3_SECURE: "false"
      IM_S3_PUBLIC_SECURE: "true"
      IM_CALL_INVITE_TTL: ${IM_CALL_INVITE_TTL:-30s}
    expose:
      - "8080"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    stop_grace_period: 30s

  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    expose:
      - "5432"
    volumes:
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/postgres/data:/var/lib/postgresql/data
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/postgres/archive:/var/lib/postgresql/archive
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  redis:
    <<: *service-defaults
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$${REDIS_PASSWORD}\""]
    expose:
      - "6379"
    volumes:
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/redis:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/minio:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      IM_S3_BUCKET: ${IM_S3_BUCKET:-nexachat-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${IM_S3_BUCKET}";
        mc anonymous set none "local/$${IM_S3_BUCKET}";
        mc version enable "local/$${IM_S3_BUCKET}"
    networks:
      - data
    restart: "no"
    logging: *service-logging

  minio-client:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["ops"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      IM_S3_BUCKET: ${IM_S3_BUCKET:-nexachat-media}
    volumes:
      - ${BACKUP_DIR:-/opt/nexachat/backups}:/backup
    networks:
      - data
    entrypoint: ["/bin/sh"]

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
