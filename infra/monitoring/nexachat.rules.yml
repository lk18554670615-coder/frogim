groups:
  - name: nexachat-performance
    rules:
      - alert: NexaChatHighHTTPP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(im_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: NexaChat API P95 latency is high
          description: Global HTTP P95 latency has remained above 500 ms for ten minutes.

      - alert: NexaChatDatabasePoolSaturated
        expr: im_db_pool_acquired_connections / im_db_pool_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: NexaChat database pool is close to saturation
          description: More than 80 percent of the configured PostgreSQL pool has been acquired for five minutes.

      - alert: NexaChatPushBacklogOld
        expr: im_push_outbox_oldest_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: NexaChat push delivery backlog is delayed
          description: The oldest pending push has waited more than one minute.

      - alert: NexaChatMessageFanoutBacklog
        expr: im_message_fanout_oldest_seconds > 10 or im_message_fanout_pending > 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: NexaChat durable message fanout is falling behind
          description: Per-user sync expansion cannot keep up with incoming messages.

      - alert: NexaChatWebSocketDrops
        expr: rate(im_websocket_dropped_events_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: NexaChat WebSocket clients are falling behind
          description: Slow WebSocket consumers are dropping live events and relying on durable cursor recovery.

  - name: nexachat-availability
    rules:
      - alert: NexaChatServerDown
        expr: up{job="nexachat-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 邻里通讯 API 不可用
          description: Prometheus 已连续两分钟无法抓取 linli-im 服务。

      - alert: NexaChatErrorRateIncreasing
        expr: rate(im_errors_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 邻里通讯错误率持续升高
          description: linli-im 服务已连续十分钟每秒产生超过 0.2 个错误。

      - alert: NexaChatNoHTTPActivity
        expr: rate(im_http_requests_total[15m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 邻里通讯没有可观测的 HTTP 流量
          description: 请先检查入口路由和客户端连通性，再判定是否为服务中断。
