port: 7880
prometheus_port: 6789

rtc:
  tcp_port: 7881
  udp_port: 7882-7889
  use_external_ip: true
  allow_tcp_fallback: true

room:
  auto_create: false
  empty_timeout: 60
  departure_timeout: 20
  max_participants: 9
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/h264

logging:
  level: info
  pion_level: error
  json: true
