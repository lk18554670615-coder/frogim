# 兼容标识：生产 project 名关联既有 volume/network，迁移前不得修改。
name: nexachat-production

x-logging: &production-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-10}"
    compress: "true"

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  pids_limit: ${CONTAINER_PIDS_LIMIT:-256}
  ulimits:
    nofile:
      soft: ${CONTAINER_NOFILE_SOFT:-65536}
      hard: ${CONTAINER_NOFILE_HARD:-65536}
  logging: *production-logging
  security_opt:
    - no-new-privileges:true

services:
  gateway:
    <<: *service-defaults
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/caddy/data:/data
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/caddy/config:/config
    networks:
      - edge
      - app
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile.web
      args:
        WEB_API_BASE_URL: https://${DOMAIN:?set DOMAIN}
        WEB_BASE_HREF: /web/
        APP_ENV: production
        ENABLE_DEMO: "false"
        TERMS_URL: ${TERMS_URL:?set TERMS_URL}
        PRIVACY_URL: ${PRIVACY_URL:?set PRIVACY_URL}
    expose:
      - "8080"
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  admin:
    <<: *service-defaults
    build:
      context: ../apps/admin
      args:
        VITE_ADMIN_API_URL: /api/v2/admin
        VITE_ALLOW_DEMO: "false"
    expose:
      - "8080"
    networks:
      - app
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  server:
    <<: *service-defaults
    build:
      context: ../server
    environment:
      IM_ADDR: :8080
      IM_ENV: production
      IM_LOG_LEVEL: ${IM_LOG_LEVEL:-info}
      GOMEMLIMIT: ${SERVER_GO_MEMORY_LIMIT:-768MiB}
      GOMAXPROCS: ${SERVER_GO_MAX_PROCS:-2}
      IM_DATABASE_URL: ${IM_DATABASE_URL:?set IM_DATABASE_URL}
      IM_DB_MAX_CONNS: ${IM_DB_MAX_CONNS:-20}
      IM_DB_MIN_CONNS: ${IM_DB_MIN_CONNS:-2}
      IM_DB_MAX_CONN_LIFETIME: ${IM_DB_MAX_CONN_LIFETIME:-1h}
      IM_DB_MAX_CONN_IDLE_TIME: ${IM_DB_MAX_CONN_IDLE_TIME:-15m}
      IM_DB_HEALTH_CHECK_PERIOD: ${IM_DB_HEALTH_CHECK_PERIOD:-1m}
      IM_DB_STATEMENT_TIMEOUT: ${IM_DB_STATEMENT_TIMEOUT:-15s}
      IM_REDIS_URL: ${IM_REDIS_URL:?set IM_REDIS_URL}
      IM_JWT_SECRET: ${IM_JWT_SECRET:?set IM_JWT_SECRET}
      IM_ADMIN_USERNAME: ${IM_ADMIN_USERNAME:-}
      IM_ADMIN_CONTACT_EMAIL: ${IM_ADMIN_CONTACT_EMAIL:-}
      IM_ADMIN_PASSWORD_HASH: ${IM_ADMIN_PASSWORD_HASH:-}
      IM_PUSH_PROVIDER: ${IM_PUSH_PROVIDER:?set IM_PUSH_PROVIDER}
      IM_WEB_PUSH_PUBLIC_KEY: ${IM_WEB_PUSH_PUBLIC_KEY:-}
      IM_WEB_PUSH_PRIVATE_KEY: ${IM_WEB_PUSH_PRIVATE_KEY:-}
      IM_WEB_PUSH_SUBJECT: ${IM_WEB_PUSH_SUBJECT:-}
      IM_GETUI_APP_ID: ${IM_GETUI_APP_ID:-}
      IM_GETUI_APP_KEY: ${IM_GETUI_APP_KEY:-}
      IM_GETUI_MASTER_SECRET: ${IM_GETUI_MASTER_SECRET:-}
      IM_DEV_MODE: "false"
      IM_SEED_DEMO: "false"
      IM_DEV_ALLOW_CONTAINER_BIND: "false"
      IM_TRUST_PROXY: "true"
      IM_ACCESS_TTL: ${IM_ACCESS_TTL:-15m}
      IM_REFRESH_TTL: ${IM_REFRESH_TTL:-720h}
      IM_MEDIA_MAX_BYTES: ${IM_MEDIA_MAX_BYTES:-104857600}
      IM_PUSH_WEBHOOK_URL: ${IM_PUSH_WEBHOOK_URL:-}
      IM_PUSH_WEBHOOK_TOKEN: ${IM_PUSH_WEBHOOK_TOKEN:-}
      IM_OTP_WEBHOOK_URL: ${IM_OTP_WEBHOOK_URL:?set IM_OTP_WEBHOOK_URL}
      IM_OTP_WEBHOOK_TOKEN: ${IM_OTP_WEBHOOK_TOKEN:?set IM_OTP_WEBHOOK_TOKEN}
      IM_S3_ENDPOINT: minio:9000
      IM_S3_PUBLIC_ENDPOINT: ${IM_S3_PUBLIC_ENDPOINT:?set IM_S3_PUBLIC_ENDPOINT}
      IM_S3_ACCESS_KEY: ${MINIO_APP_USER:?set MINIO_APP_USER}
      IM_S3_SECRET_KEY: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      IM_S3_BUCKET: ${IM_S3_BUCKET:-nexachat-media}
      IM_S3_REGION: ${IM_S3_REGION:-us-east-1}
      IM_S3_SECURE: "false"
      IM_S3_PUBLIC_SECURE: ${IM_S3_PUBLIC_SECURE:-true}
      IM_CALL_INVITE_TTL: ${IM_CALL_INVITE_TTL:-30s}
      IM_PUSH_WORKERS: ${IM_PUSH_WORKERS:-16}
      IM_PUSH_BATCH_SIZE: ${IM_PUSH_BATCH_SIZE:-200}
      IM_RUNTIME_CLEANUP_INTERVAL: ${IM_RUNTIME_CLEANUP_INTERVAL:-1h}
      IM_OUTBOX_RETENTION: ${IM_OUTBOX_RETENTION:-168h}
      IM_HTTP_LOG_SUCCESS_SAMPLE_RATE: ${IM_HTTP_LOG_SUCCESS_SAMPLE_RATE:-0.01}
      IM_HTTP_RATE_LIMIT_PER_MINUTE: ${IM_HTTP_RATE_LIMIT_PER_MINUTE:-30000}
      IM_WUKONG_INTERNAL_RATE_LIMIT_PER_MINUTE: ${IM_WUKONG_INTERNAL_RATE_LIMIT_PER_MINUTE:-120000}
    expose:
      - "8080"
    networks:
      # Direct push providers (for example Getui) require outbound HTTPS.
      - edge
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    stop_grace_period: 30s
    cpus: ${SERVER_CPU_LIMIT:-2.0}
    mem_limit: ${SERVER_MEMORY_LIMIT:-1g}

  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-500}
    expose:
      - "5432"
    volumes:
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/postgres/data:/var/lib/postgresql/data
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/postgres/archive:/var/lib/postgresql/archive
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}

  redis:
    <<: *service-defaults
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory \"${REDIS_MAXMEMORY:-384mb}\" --maxmemory-policy volatile-lru --requirepass \"$${REDIS_PASSWORD}\""]
    expose:
      - "6379"
    volumes:
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/redis:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    cpus: ${REDIS_CPU_LIMIT:-1.0}
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/minio:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?set MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set MINIO_APP_PASSWORD}
      IM_S3_BUCKET: ${IM_S3_BUCKET:-nexachat-media}
    volumes:
      - ./minio-init.sh:/config/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/config/minio-init.sh"]
    networks:
      - data
    restart: "no"
    logging: *production-logging

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/nexachat.rules.yml:/etc/prometheus/nexachat.rules.yml:ro
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/monitoring/prometheus:/prometheus
    expose:
      - "9090"
    networks:
      - app
    depends_on:
      server:
        condition: service_healthy
      backup-metrics:
        condition: service_started

  backup-metrics:
    <<: *service-defaults
    image: docker.io/prom/node-exporter@sha256:863b62ff9f392b6f472e22b4b670ad1cabb66b3042502ebd4b2cd192733e1bce
    platform: linux/amd64
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
      - --web.listen-address=:9100
    volumes:
      - ${BACKUP_METRICS_DIR:?set BACKUP_METRICS_DIR}:/var/lib/node_exporter/textfile:ro
    expose:
      - "9100"
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    <<: *service-defaults
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${LINLI_DATA_ROOT:?set LINLI_DATA_ROOT}/monitoring/grafana:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - app
    depends_on:
      - prometheus

  minio-client:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    profiles: ["ops"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      IM_S3_BUCKET: ${IM_S3_BUCKET:-nexachat-media}
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_ACCESS_KEY: ${BACKUP_OFFSITE_ACCESS_KEY:-}
      BACKUP_OFFSITE_SECRET_KEY: ${BACKUP_OFFSITE_SECRET_KEY:-}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backup
    networks:
      - data
      - edge
    entrypoint: ["/bin/sh"]

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
