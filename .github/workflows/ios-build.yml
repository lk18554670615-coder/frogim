name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-build.yml'
      - 'apps/mobile/**'
      - 'packages/getuiflut/**'
      - 'third_party/flutter_webrtc-1.4.0-full-display/**'
      - 'third_party/wukongim/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ios-build.yml'
      - 'apps/mobile/**'
      - 'packages/getuiflut/**'
      - 'third_party/flutter_webrtc-1.4.0-full-display/**'
      - 'third_party/wukongim/**'
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: '使用仓库 Secrets 构建签名 IPA'
        required: true
        default: false
        type: boolean

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
  PUB_HOSTED_URL: https://pub.dev

jobs:
  compile:
    name: Compile iOS without signing
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter from FVM config
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/.fvmrc
          cache: true
          pub-cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter compact

      - name: Compile release iOS app without signing
        run: |
          flutter build ios --release --no-codesign \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=https://18.163.165.233 \
            --dart-define=ENABLE_DEMO=false \
            --dart-define=GETUI_ENABLED=false \
            --dart-define=TERMS_URL=https://18.163.165.233/legal/terms \
            --dart-define=PRIVACY_URL=https://18.163.165.233/legal/privacy \
            --dart-define=MEDIA_MAX_BYTES=104857600

      - name: Package unsigned app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ios/Runner-unsigned.zip

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.run_number }}
          path: apps/mobile/build/ios/Runner-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  signed-ipa:
    name: Build signed IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_ipa == true
    needs: compile
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      GETUI_APP_ID: ${{ secrets.GETUI_APP_ID }}
      GETUI_APP_KEY: ${{ secrets.GETUI_APP_KEY }}
      GETUI_APP_SECRET: ${{ secrets.GETUI_APP_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter from FVM config
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: apps/mobile/.fvmrc
          cache: true
          pub-cache: true

      - name: Validate signing Secrets
        shell: bash
        run: |
          required=(
            IOS_CERTIFICATE_P12_BASE64
            IOS_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
            IOS_EXPORT_OPTIONS_PLIST_BASE64
            IOS_KEYCHAIN_PASSWORD
            GETUI_APP_ID
            GETUI_APP_KEY
            GETUI_APP_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Secret ${name} is required for a signed IPA"
              exit 1
            fi
          done

      - name: Install signing certificate and provisioning profile
        id: signing
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/ios-distribution.p12"
          profile_path="${RUNNER_TEMP}/distribution.mobileprovision"
          profile_plist="${RUNNER_TEMP}/distribution-profile.plist"
          export_options_path="${RUNNER_TEMP}/ExportOptions.plist"
          keychain_path="${RUNNER_TEMP}/ios-signing.keychain-db"

          printf '%s' "${IOS_CERTIFICATE_P12_BASE64}" | /usr/bin/base64 -D > "${certificate_path}"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | /usr/bin/base64 -D > "${profile_path}"
          printf '%s' "${IOS_EXPORT_OPTIONS_PLIST_BASE64}" | /usr/bin/base64 -D > "${export_options_path}"

          security create-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${IOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "${IOS_KEYCHAIN_PASSWORD}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -d user -s "${keychain_path}"

          security cms -D -i "${profile_path}" > "${profile_plist}"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "${profile_plist}")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "${profile_plist}")
          profiles_dir="${HOME}/Library/MobileDevice/Provisioning Profiles"
          installed_profile="${profiles_dir}/${profile_uuid}.mobileprovision"
          mkdir -p "${profiles_dir}"
          cp "${profile_path}" "${installed_profile}"

          echo "Provisioning profile: ${profile_name} (${profile_uuid})"
          echo "keychain_path=${keychain_path}" >> "${GITHUB_OUTPUT}"
          echo "installed_profile=${installed_profile}" >> "${GITHUB_OUTPUT}"
          echo "export_options_path=${export_options_path}" >> "${GITHUB_OUTPUT}"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --export-options-plist="${{ steps.signing.outputs.export_options_path }}" \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=https://18.163.165.233 \
            --dart-define=ENABLE_DEMO=false \
            --dart-define=GETUI_ENABLED=true \
            --dart-define=GETUI_APP_ID="${GETUI_APP_ID}" \
            --dart-define=GETUI_APP_KEY="${GETUI_APP_KEY}" \
            --dart-define=GETUI_APP_SECRET="${GETUI_APP_SECRET}" \
            --dart-define=TERMS_URL=https://18.163.165.233/legal/terms \
            --dart-define=PRIVACY_URL=https://18.163.165.233/legal/privacy \
            --dart-define=MEDIA_MAX_BYTES=104857600

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-signed-${{ github.run_number }}
          path: apps/mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${{ steps.signing.outputs.installed_profile }}" ]]; then
            rm -f "${{ steps.signing.outputs.installed_profile }}"
          fi
          if [[ -n "${{ steps.signing.outputs.keychain_path }}" ]]; then
            security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
          fi
          rm -f \
            "${RUNNER_TEMP}/ios-distribution.p12" \
            "${RUNNER_TEMP}/distribution.mobileprovision" \
            "${RUNNER_TEMP}/distribution-profile.plist" \
            "${RUNNER_TEMP}/ExportOptions.plist"
